<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title> Kō.tools </title>
    <link rel="stylesheet" href="../css/reservation.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <header class = "navigation">
    </header>
    <main>
        <form class="form_container">
            <h2>Type de réservation</h2>
            <div class="res_type">
            </div>
            <h2>Status</h2>
            <div class="status">
            </div>
            <div class="bloc-row">
                <div class="theme_form">
                    <h2>Thèmes</h2>
                    <div class="theme">
                    </div>
                </div>
                <div class="date_hour_form">
                    <h2>Date et heure</h2>
                    <div class="field">
                        <label for="reservation_date">Date de la réservation</label>
                        <input type="date" id="reservation_date" name="reservation_date" required>
                    </div>
                    <div class="field">
                        <label for="hour">Heure de la réservation</label>
                        <input type="time" id="hour" name="hour" required>
                    </div>
                </div>
            </div>
            <div class="bloc-row">
                <div class="struct_form">
                    <h2>Structure</h2>
                    <div class="field">
                        <label for="struct_type">Type</label>
                        <select id="struct_type" name="struct_type" required>
                            <!-- Nourri dynamiquement par un fetch API -->
                            <option value="">Selectionnez un type de structure</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="struct_zip">Code postal</label>
                        <input type="text" id="struct_zip" name="struct_zip" required>
                    </div>
                    <div class="field">
                        <label for="struct_name">Nom de la structure</label>
                        <select id="struct_name" name="struct_name" required>
                            <!-- Nourri dynamiquement par un fetch API en utilisant le type et le zip -->
                            <option value="">Renseignez un type de structure et un code postal</option>
                            <!-- Ajouter une icone pour ouvrir une creation de structure + div -->
                        </select>
                    </div>
                    <!--Les inputs doivent se remplire automatiquement avec la selection de la structure-->
                    <div class="field">
                        <label for="struct_address">Adresse</label>
                        <input id="struct_address" name="struct_address" required readonly>
                    </div>
                    <div class="field">
                        <label for="struct_town">Ville</label>
                        <input id="struct_town" name="struct_town" required readonly>
                    </div>
                    <div class="field">
                        <label for="struct_mail">Email</label>
                        <input id="struct_mail" name="struct_mail" required readonly>
                    </div>
                    <div class="field">
                        <label for="struct_tel">Telephone</label>
                        <input id="struct_tel" name="struct_tel" required readonly>
                    </div>
                </div>
                <div class="contact_form">
                    <h2>Contact</h2>
                    <div class="field">
                        <label for="contact_firstname">Nom</label>
                        <input type="text" id="contact_firstname" name="contact_firstname" required>
                    </div>
                    <div class="field">
                        <label for="contact_lastname">Prénom</label>
                        <input type="text" id="contact_lastname" name="contact_lastname" required>
                    </div>
                    <div class="field">
                        <label for="contact_email">Email</label>
                        <input type="email" id="contact_email" name="contact_email" required>
                    </div>
                    <div class="field">
                        <label for="contact_phone">Telephone</label>
                        <input type="tel" id="contact_phone" name="contact_phone" required>
                    </div>
                    <div class="field">
                        <label for="contact_role">Role</label>
                        <input type="text" id="contact_role" name="contact_role" required>
                    </div>
                </div>
            </div>
            <h2>Audiences</h2>
            <div class="audience_form">
            </div>
            <div class="price_form">
                <h2>Prix</h2>
                <div class="field">
                        <label for="price">Montant</label>
                        <input type="number" id="price" name="price">
                    </div>
            </div>
        <input type="submit" id="submit" value="Enregistrer">
        </form>
        <script type="module" src="../js/reservation.js"></script>
    </main>
</body>

</html>
