<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title> Kō.tools </title>
    <link rel="stylesheet" href="reservation.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <header class = "navigation">
        <div class="icons">
            <img src="add-icon.png" alt="Nouvelle réservation"></img>
            <img src="import-icon.png" alt="Exporter"></img>
        </div>

       <div class = "identity">
        <p><b>Mathieu</b></p>
        <p><b>Majérus</b></p>
        </div>
    </header>
    <main>
        <form class="form_container">
            <h2>Status</h2>
            <div class="status">
                <div class="field">
                        <label for="res_status">Type</label><br>
                        <select id="res_status" name="res_status">
                            <!-- Nourri dynamiquement par un fetch API -->
                            <option value="">Veuillez choisir une option</option>
                            <option value="attente">En attente d'informations</option>
                            <option value="signature1">Signature établissement en cours</option>
                            <option value="signature2">Signature direction en cours</option>
                            <option value="reservee">Réservée</option>
                            <option value="facture">A facturer</option>
                            <option value="clot">Réservation close</option>
                        </select><br>
                    </div>
            </div>
            <h2>Thèmes</h2>
            <div class="theme">
                <!-- Nourri dynamiquement par un fetch api -->
                <div class="field">
                    <input type="radio" id="retour_vers_la_prehistoire" name="retour_vers_la_prehistoire">
                    <label for="retour_vers_la_prehistoire">Retour vers la Péehistoire</label>
                </div>
                <div class="field">
                    <input type="radio" id="lait" name="lait">
                    <label for="lait">Les métamorphoses du lait</label>
                </div>
                <div class="field">
                    <input type="radio" id="electricite" name="electricte">
                    <label for="electricite">Eléctricité</label>
                </div>
            </div>
            <div class="bloc-row">
                <div class="struct_form">
                    <h2>Structure</h2>
                    <div class="field">
                        <label for="struct_type">Type</label><br>
                        <select id="struct_type" name="struct_type">
                            <!-- Nourri dynamiquement par un fetch API -->
                            <option value="">Veuillez choisir une option</option>
                            <option value="school">Ecole primaire</option>
                            <option value="college">Collège</option>
                            <option value="lycée">Lycée</option>
                            <option value="library">Bibliothèque</option>
                        </select><br>
                    </div>
                    <div class="field">
                        <label for="struct_zip">Code postal</label><br>
                        <input type="text" id="zip" name="zip"><br>
                    </div>
                    <div class="field">
                        <label for="struct_name">Nom de la structure</label><br>
                        <select id="struct_name" name="struct_name">
                            <!-- Nourri dynamiquement par un fetch API en utilisant le type et le zip -->
                            <option value="">Selectionner la structure</option>
                            <!-- Ajouter une icone pour ouvrir une creation de structure + div -->
                            <option value="Ecole Saint-Exupéry">Ecole Saint-Exupéry</option>
                            <option value="Collège de Montsauche">Collège de Montsauche</option>
                        </select><br>
                    </div>
                    <!--Les inputs doivent se remplire automatiquement avec la selection de la structure-->
                    <div class="field">
                        <label for="struct_adress">Adresse</label><br>
                        <input id="struct_adress" name="struct_adress"><br>
                    </div>
                    <div class="field">
                        <label for="struct_mail">Email</label><br>
                        <input id="struct_mail" name="struct_mail"><br>
                    </div>
                    <div class="field">
                        <label for="struct_tel">Telephone</label><br>
                        <input id="struct_tel" name="struct_tel"><br>
                    </div>
                </div>
                <div class="contact_form">
                    <h2>Contact</h2>
                    <div class="field">
                        <label for="contact_firstname">Nom</label><br>
                        <input type="text" id="contact_firstname" name="contact_firstname"><br>
                    </div>
                    <div class="field">
                        <label for="contact_lastname">Prénom</label><br>
                        <input type="text" id="contact_lastname" name="contact_lastname"><br>
                    </div>
                    <div class="field">
                        <label for="contact_mail">Email</label><br>
                        <input id="contact_mail" name="contact_mail"><br>
                    </div>
                    <div class="field">
                        <label for="contact_tel">Telephone</label><br>
                        <input id="contact_tel" name="contact_tel"><br>
                    </div>
                </div>
            </div>
            <h2>Audiences</h2>
            <div class="audience_form">
                <div class="maternelle">
                    <h3>Maternelle</h3><br>
                    <div class="field">
                        <label for="PS">PS</label><br>
                        <input type="number" id="PS" name="PS"><br>
                    </div>
                    <div class="field">
                        <label for="MS">MS</label><br>
                        <input type="number" id="MS" name="GS"><br>
                    </div>
                    <div class="field">
                        <label for="GS">GS</label><br>
                        <input type="number" id="GS" name="GS"><br>
                    </div>
                </div>
                <div class="primaire">
                    <h3>Primaire</h3><br>
                    <div class="field">
                        <label for="CP">CP</label><br>
                        <input type="number" id="CP" name="CP"><br>
                    </div>
                    <div class="field">
                        <label for="CE1">CE1</label><br>
                        <input type="number" id="CE1" name="CE1"><br>
                    </div>
                    <div class="field">
                        <label for="CE2">CE2</label><br>
                        <input type="number" id="CE2" name="CE2"><br>
                    </div>
                    <div class="field">
                        <label for="CM1">CM1</label><br>
                        <input type="number" id="CM1" name="CM1"><br>
                    </div>
                    <div class="field">
                        <label for="CM2">CM2</label><br>
                        <input type="number" id="CM2" name="CM2"><br>
                    </div>
                </div>
                <div class="college">
                    <h3>Collège</h3><br>
                    <div class="field">
                        <label for="6e">6e</label><br>
                        <input type="number" id="6e" name="6e"><br>
                    </div>
                    <div class="field">
                        <label for="5e">5e</label><br>
                        <input type="number" id="5e" name="5e"><br>
                    </div>
                    <div class="field">
                        <label for="4e">4e</label><br>
                        <input type="number" id="4e" name="4e"><br>
                    </div>
                    <div class="field">
                        <label for="3e">3e</label><br>
                        <input type="number" id="3e" name="3e"><br>
                    </div>
                </div>
                <div class="lycee">
                    <h3>Lycée</h3><br>
                    <div class="field">
                        <label for="seconde">Seconde</label><br>
                        <input type="number" id="seconde" name="seconde"><br>
                    </div>
                    <div class="field">
                        <label for="premiere">Première</label><br>
                        <input type="number" id="premiere" name="premiere"><br>
                    </div>
                    <div class="field">
                        <label for="terminale">Terminale</label><br>
                        <input type="number" id="terminale" name="terminale"><br>
                    </div>
                </div>
                <div class="no_school">
                    <h3>Non scolaire</h3><br>
                    <div class="field">
                        <label for="enfants">Enfants</label><br>
                        <input type="number" id="enfants" name="enfants"><br>
                    </div>
                    <div class="field">
                        <label for="adultes">Adultes</label><br>
                        <input type="number" id="adultes" name="adultes"><br>
                    </div>
                </div>
            </div>
        </form>
    </main>
</body>

</html>
